name: Release Bundle

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-bundle-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-bundle:
    name: Build reviewable release bundle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --fund=false

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build web export
        run: npm run build:web

      - name: Create release bundle
        run: tar -czf release-bundle-web.tgz dist

      - name: Verify release bundle
        run: |
          test -s release-bundle-web.tgz
          tar -tzf release-bundle-web.tgz >/tmp/release-bundle-file-list.txt
          wc -l /tmp/release-bundle-file-list.txt

      - name: Upload release bundle
        uses: actions/upload-artifact@v7
        with:
          name: web-release-bundle-${{ github.sha }}
          path: release-bundle-web.tgz
          if-no-files-found: error
          retention-days: 30

      - name: Deployment boundary
        run: echo "Release bundle built for review; live deploy is intentionally not performed by this workflow."
